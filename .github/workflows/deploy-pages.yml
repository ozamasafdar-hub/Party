name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/qatar-event-map-app-u89x33]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Supabase project URL + anon key. These are public by design —
          # they ship to every visitor's browser and data is protected by
          # Row Level Security — so they're pinned here to keep deploys
          # deterministic instead of relying on hand-pasted secrets.
          VITE_SUPABASE_URL: https://zfulodaqnnozyucgpxtw.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmdWxvZGFxbm5venl1Y2dweHR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDk3MjcsImV4cCI6MjEwMDkyNTcyN30.pVDXxoCw8ZhsgY_OeWfKf8XoY7xhaszBHyeQSrfDm7g
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
