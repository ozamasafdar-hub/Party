<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f19" />
    <title>WYN — see what’s on in Qatar</title>
    <meta
      name="description"
      content="A live map of what’s happening around Doha tonight. Find an event, join it, or host your own."
    />

    <!--
      Link previews. Everything here is the same on every host; the three
      tags that must carry the full domain (og:url, og:image, twitter:image)
      are injected at build time from site.config.js — see build/site-plugin.js.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WYN" />
    <meta property="og:title" content="WYN — see what’s on in Qatar" />
    <meta
      property="og:description"
      content="A live map of what’s happening around Doha tonight. Find an event, join it, or host your own."
    />
    <meta property="og:locale" content="en_QA" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WYN — a live map of what’s on in Qatar tonight" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WYN — see what’s on in Qatar" />
    <meta
      name="twitter:description"
      content="A live map of what’s happening around Doha tonight. Find an event, join it, or host your own."
    />

    <!--
      Add to Home Screen. iOS reads none of the manifest: the apple-touch-icon
      and the two apple- meta tags below are the whole of its support, and
      without them WYN installs as a screenshot of the page in a browser
      frame. Android reads the manifest and ignores these.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WYN" />
    <!-- translucent: the map runs under the status bar, as it does in-app -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 44'%3E%3Cdefs%3E%3ClinearGradient id='d' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23AC2148'/%3E%3Cstop offset='1' stop-color='%237C1533'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M20 43.2C10.4 32.6 3.4 25.6 3.4 17.1a16.6 16.6 0 1 1 33.2 0c0 8.5-7 15.5-16.6 26.1Z' fill='url(%23d)'/%3E%3Ccircle cx='20' cy='16.8' r='8.5' fill='none' stroke='white' stroke-width='4.6'/%3E%3Cpath d='M23.9 21.9c1.6 4-2.1 7.3-6.6 6-1.7-.5-3.2 0-4.2 1.2' fill='none' stroke='white' stroke-width='4.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
